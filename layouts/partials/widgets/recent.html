{{- if .Site.Params.widgets.recent_articles -}}
<div class="widget">
	<header>
		<h4><span class="fa fa-pencil"></span> <a href="{{ "post/" | relLangURL }}">{{ i18n "news" }}</a></h4>
	</header>
	<ul>
		{{- range first 10 (where .Site.RegularPages "Section" "post") -}}
		<li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
		{{- end -}}
	</ul>
</div>
{{- end -}}
