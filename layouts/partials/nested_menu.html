{{- $page := .page -}}
{{- range sort .menu -}}
<li><a href="{{ .URL | relURL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ if .HasChildren }}<ul>{{ partial "nested_menu.html" (dict "menu" .Children "page" $page) }}</ul>{{ end }}</li>
{{- end -}}
