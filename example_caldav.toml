# Example configuration for chaosseminar_to_caldav.py
#
# Copy this file to chaosseminar_caldav.toml and fill in your values:
#     cp chaosseminar_caldav.example.toml chaosseminar_caldav.toml
#     chmod 600 chaosseminar_caldav.toml
#
# chaosseminar_caldav.toml contains the password: keep it private and do not commit it to git.

[caldav]
# Calendar collection URL (with trailing slash), e.g. a Radicale calendar
url      = "http://localhost:port/username/calendar"
# Login for HTTP Basic authentication
user     = "USERNAME"
password = 'PASSWORD'

[site]
# Website address; the calendar entry links to <url>/<page_path>/<file name without .md>/
url       = "https://ulm.ccc.de"
# Path of the Chaosseminar pages on the website (no leading or trailing slash needed)
page_path = "ccc/chaosseminar"

[paths]
# Folder with the Hugo pages, relative to this config file (or an absolute path)
content_dir = "content/ccc/chaosseminar"

[seminar]
# Time zone of the "Termin" field
timezone                 = "Europe/Berlin"
# Duration of a seminar, because "Termin" has no end time (in minutes)
default_duration_minutes = 120
# Text in front of the page title in the calendar entry
summary_prefix           = "Chaosseminar: "
# Categories of the calendar entry if the page has none
default_categories       = ["Chaosseminar"]
# Appointments in this category are never removed when they overlap a seminar (lower case)
protected_category       = "chaosseminar"
# Accepted formats of "Termin" (Python strftime syntax)
termin_formats           = ["%Y-%m-%d %H:%M", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M", "%Y-%m-%dT%H:%M:%S"]
