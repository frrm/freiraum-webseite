{{- if .Site.Params.widgets.upcoming_events -}}
<div class="widget">
	<header>
		<h4><a href="/events/#termine"><span class="fa fa-calendar"></span> nächste Treffen</a></h4>
	</header>
	<ul class="events-side" data-ics-url="/kalender" data-count="{{ .Site.Params.num_events | default 10 }}">
		<li>Termine werden geladen …</li>
	</ul>
	<script type="module" src="/modules/next-events.js"></script>
</div>
{{- end -}}
