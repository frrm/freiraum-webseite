server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;
    gzip on;
    gzip_types text/plain text/css text/calendar application/json application/javascript application/wasm image/svg+xml;

    location = /healthz { access_log off; return 200 'ok\n'; }
    location ~* \.ics$ { default_type text/calendar; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~* "\.[a-f0-9]{8,}\.(css|js|wasm|png|jpg|jpeg|svg|woff2?)$" {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
