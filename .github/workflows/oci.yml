name: OCI image
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare build tools
        run: make bootstrap
      - name: Refresh release calendar
        if: github.event_name != 'pull_request'
        run: make events
      - name: Prepare deterministic PR calendar
        if: github.event_name == 'pull_request'
        run: make fixtures
      - name: Check site and build OCI archive
        run: |
          make check
          make oci
      - name: Test read-only runtime
        run: |
          docker build -f Dockerfile.runtime --build-arg REVISION="$GITHUB_SHA" -t freiraum-runtime-test .
          ./tests/runtime-smoke.sh freiraum-runtime-test
      - name: Install Skopeo
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install -y skopeo)
      - name: Prepare architecture-specific scans
        run: ./scripts/prepare-oci-scans.sh dist/freiraum.oci.tar dist/scan
      - name: Scan amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          input: dist/scan/amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          input: dist/scan/arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freiraum-oci
          path: dist/freiraum.oci.tar
  publish:
    needs: image
    if: github.repository == 'frrm/freiraum-webseite' && ((github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release is on master
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freiraum-oci
          path: dist
      - name: Install Skopeo
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install -y skopeo)
      - name: Publish scanned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="${GITHUB_SHA}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          skopeo copy --all oci-archive:dist/freiraum.oci.tar "docker://ghcr.io/frrm/freiraum-webseite:$tag"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            skopeo copy --all oci-archive:dist/freiraum.oci.tar "docker://ghcr.io/frrm/freiraum-webseite:${GITHUB_REF_NAME}"
          fi
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            skopeo copy --all oci-archive:dist/freiraum.oci.tar docker://ghcr.io/frrm/freiraum-webseite:latest
          fi
