name: build-and-deploy

on:
  pull_request:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 4 * * *'

  # add run-button on actions tab to run manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and check
        run: make bootstrap check
      - uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_PUSH_TO_FRRM_GITHUB_IO }}
        with:
          source-directory: public/
          destination-github-username: 'frrm'
          destination-repository-name: 'frrm.github.io'
          target-branch: 'master'
          commit-message: 'Update website.'
